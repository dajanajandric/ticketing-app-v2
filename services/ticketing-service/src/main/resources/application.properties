spring.application.name=ticketing-service

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

server.port=8082

# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL}
spring.mail.password=${PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# users-service klijent
users.service.url=${USERS_SERVICE_URL:http://localhost:8081}

# Resilience4j - otpornost poziva ka users-service
resilience4j.retry.instances.usersService.max-attempts=3
resilience4j.retry.instances.usersService.wait-duration=300ms
resilience4j.retry.instances.usersService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

resilience4j.circuitbreaker.instances.usersService.sliding-window-size=10
resilience4j.circuitbreaker.instances.usersService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.usersService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.usersService.permitted-number-of-calls-in-half-open-state=3
